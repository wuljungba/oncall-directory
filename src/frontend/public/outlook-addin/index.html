<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnCall Schedule</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 16px; }
    h1 { font-size: 16px; color: #f59e0b; margin-bottom: 12px; }
    .status { padding: 12px; border-radius: 8px; margin-bottom: 8px; }
    .on-call { background: #f59e0b20; border-left: 3px solid #f59e0b; }
    .off-duty { background: #1e293b; border-left: 3px solid #475569; }
    .name { font-size: 14px; font-weight: 600; }
    .detail { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .empty { text-align: center; padding: 24px; color: #64748b; font-size: 13px; }
    .badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-top: 4px; }
    .badge.primary { background: #f59e0b30; color: #f59e0b; }
    .badge.secondary { background: #3b82f630; color: #3b82f6; }
    .badge.tertiary { background: #6b728030; color: #9ca3af; }
    .error { color: #ef4444; font-size: 12px; padding: 12px; }
    .loading { text-align: center; padding: 24px; color: #94a3b8; }
    .spinner { width: 20px; height: 20px; border: 2px solid #374151; border-top-color: #f59e0b; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>📋 OnCall Schedule</h1>
  <div id="content"><div class="loading"><div class="spinner"></div>Loading...</div></div>
  <script src="index.js"></script>
</body>
</html>
