name: Deploy OnCall App

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: app-oncall-dev
  AZURE_SQL_SERVER: sql-oncall-dev
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Backend ──
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/backend/OnCallApi/OnCallApi.csproj

      - name: Build
        run: dotnet build src/backend/OnCallApi/OnCallApi.csproj --no-restore -c Release

      - name: Test
        run: dotnet test src/backend/OnCallApi/OnCallApi.csproj --no-build -c Release

      - name: Publish
        run: dotnet publish src/backend/OnCallApi/OnCallApi.csproj -c Release -o publish

      # ── Frontend ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Build frontend
        run: npm run build
        working-directory: src/frontend

      - name: Copy frontend to publish
        run: cp -r src/frontend/dist publish/wwwroot

      # ── Deploy ──
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

      - name: Run EF Core migrations
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef database update --project src/backend/OnCallApi
