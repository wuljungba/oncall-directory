name: Deploy OnCall App

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      # ── Backend ──
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/backend/OnCallApi/OnCallApi.csproj

      - name: Build
        run: dotnet build src/backend/OnCallApi/OnCallApi.csproj --no-restore -c Release

      - name: Test
        run: dotnet test src/backend/OnCallApi/OnCallApi.csproj --no-build -c Release

      - name: Publish
        run: dotnet publish src/backend/OnCallApi/OnCallApi.csproj -c Release -o publish

      # ── Frontend ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Build frontend
        run: npm run build
        working-directory: src/frontend
        env:
          VITE_AZURE_CLIENT_ID: '96955ba3-c70c-4205-8637-a4b34301480a'
          VITE_GOOGLE_CLIENT_ID: '445006464104-pcq13k9lkmcol1k5hqktu8arcrv49c5n.apps.googleusercontent.com'
          VITE_DEV_AUTH: 'false'

      - name: Copy frontend to publish
        run: cp -r src/frontend/dist publish/wwwroot

      # ── Deploy to production slot (via publish profile) ──
      - name: Deploy to production
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-oncall-${{ github.event.inputs.environment || 'dev' }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

      # ── Health check ──
      - name: Wait for app to start
        run: sleep 30

      - name: Health check
        run: |
          curl -f --max-time 60 "https://app-oncall-${{ github.event.inputs.environment || 'dev' }}.azurewebsites.net/health"
