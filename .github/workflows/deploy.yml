name: Deploy OnCall App

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
          - production

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      # ── Backend ──
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/backend/OnCallApi/OnCallApi.csproj

      - name: Build
        run: dotnet build src/backend/OnCallApi/OnCallApi.csproj --no-restore -c Release

      # The API project holds no tests, so pointing `dotnet test` at it silently ran
      # nothing and every deploy passed an empty gate. The suite lives in tests/.
      - name: Test
        run: dotnet test tests/BackendTests/BackendTests.csproj -c Release

      - name: Publish
        run: dotnet publish src/backend/OnCallApi/OnCallApi.csproj -c Release -o publish

      # ── Frontend ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Build frontend
        run: npm run build
        working-directory: src/frontend
        env:
          VITE_AZURE_CLIENT_ID: ${{ secrets.VITE_AZURE_CLIENT_ID }}
          # Without this the build falls back to the tenant hardcoded in
          # microsoftAuthProvider.ts, so a deployed frontend can point at a different
          # tenant than the backend validates against -- silently, and only for Entra
          # sign-in. Unset is safe: an empty value falls through to that same fallback.
          VITE_AZURE_AUTHORITY: ${{ secrets.VITE_AZURE_AUTHORITY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_DEV_AUTH: 'false'

      - name: Copy frontend to publish
        run: cp -r src/frontend/dist publish/wwwroot

      # ── Deploy to the staging slot first ──
      # Nothing reaches production without passing a health check on staging
      # (.claude/rules/hipaa-guardrails.md). This workflow previously deployed
      # straight to the production slot, so a broken build took production with it
      # and the health check only reported the damage after the fact.
      - name: Deploy to staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-oncall-${{ github.event.inputs.environment || 'dev' }}
          slot-name: staging
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          package: publish

      - name: Wait for staging to start
        run: sleep 30

      # The gate. If staging is unhealthy the job stops here and production is
      # left untouched, still serving the previous build.
      - name: Health check staging
        run: |
          curl -f --max-time 60 "https://app-oncall-${{ github.event.inputs.environment || 'dev' }}-staging.azurewebsites.net/health"

      # ── Swap into production ──
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Swapping is near-instant and reversible: running the same swap again puts
      # the previous build back, which is the rollback path.
      - name: Swap staging into production
        run: |
          az webapp deployment slot swap             --resource-group rg-oncall-${{ github.event.inputs.environment || 'dev' }}             --name app-oncall-${{ github.event.inputs.environment || 'dev' }}             --slot staging --target-slot production

      - name: Health check production
        run: |
          curl -f --max-time 60 "https://app-oncall-${{ github.event.inputs.environment || 'dev' }}.azurewebsites.net/health"
