name: Deploy OnCall App

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      # ── Backend ──
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/backend/OnCallApi/OnCallApi.csproj

      - name: Build
        run: dotnet build src/backend/OnCallApi/OnCallApi.csproj --no-restore -c Release

      - name: Test
        run: dotnet test src/backend/OnCallApi/OnCallApi.csproj --no-build -c Release

      - name: Publish
        run: dotnet publish src/backend/OnCallApi/OnCallApi.csproj -c Release -o publish

      # ── Frontend ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Build frontend
        run: npm run build
        working-directory: src/frontend

      - name: Copy frontend to publish
        run: cp -r src/frontend/dist publish/wwwroot

      # ── Deploy to staging slot ──
      - name: Deploy to staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-oncall-${{ github.event.inputs.environment || 'dev' }}
          slot-name: staging
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish

      # ── Health check ──
      - name: Wait for app to start
        run: sleep 30

      - name: Health check
        run: |
          curl -f --max-time 30 "https://app-oncall-${{ github.event.inputs.environment || 'dev' }}.azurewebsites.net/health"

      # ── Swap staging to production ──
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Swap staging to production
        run: |
          az webapp deployment slot swap \
            --name app-oncall-${{ github.event.inputs.environment || 'dev' }} \
            --resource-group rg-oncall-${{ github.event.inputs.environment || 'dev' }} \
            --slot staging \
            --target-slot production
